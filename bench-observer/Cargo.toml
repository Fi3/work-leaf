[package]
name = "work-leaf-bench-observer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "work_leaf_bench_observer"
path = "src/lib.rs"

[[bin]]
name = "bench-observer"
path = "src/main.rs"

[[bin]]
name = "bench-observer-fixture"
path = "src/bin/bench-observer-fixture.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
